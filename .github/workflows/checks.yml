name: Repository checks
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scan and IDS dashboard behavior
        run: node --test dashboard/tests/*.test.cjs
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify numeric ownership survives snapshot/restore
        run: sudo python3 -m unittest discover -s tests -p 'test_suite.py' -v
      - name: Verify host dry-run skips mutations and downloads
        run: sudo python3 -m unittest discover -s tests -p 'test_setup_scripts.py' -v
      - name: Check setup scripts
        run: shellcheck scripts/pre-req.sh scripts/install-suite.sh
