/var/log/four-security/ids-poc/*.log /var/log/four-security/ids-poc/*.json {
    daily
    maxsize 20M
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    create 0600 root root
    postrotate
        /usr/bin/docker kill --signal=HUP four-ids-poc >/dev/null 2>&1 || true
    endscript
}
